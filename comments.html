<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Komentar — Portfolio Tiara</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Desain Khusus Halaman Komentar */
        body {
            background-color: var(--cream);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Minimalis */
        .comments-header {
            background: rgba(253, 251, 247, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            height: var(--nav-h, 68px);
            display: flex;
            align-items: center;
            padding: 0 var(--px);
            border-bottom: 1px solid var(--sand-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .comments-brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .comments-logo {
            width: 32px;
            height: 32px;
            background: var(--olive);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(107, 112, 64, 0.15);
        }

        .comments-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 500;
            color: var(--text-dark);
            margin: 0;
        }

        /* Container Utama */
        .comments-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem var(--px) 4rem;
            width: 100%;
            flex: 1;
        }

        .back-nav {
            margin-bottom: 3rem;
        }

        /* Layout Grid: Kiri (Teks+Form), Kanan (Daftar Komentar) */
        .comments-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: clamp(3rem, 6vw, 5rem);
            align-items: start;
        }

        /* Sisi Kiri */
        .comments-left {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .comment-form-card {
            background: var(--white);
            padding: clamp(1.5rem, 4vw, 2.5rem);
            border-radius: 16px;
            border: 1px solid var(--sand-light);
            box-shadow: 0 8px 30px rgba(107, 112, 64, 0.06);
        }

        .comment-field-group {
            margin-bottom: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .comment-field-group label {
            font-family: 'Jost', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-mid);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .comment-field-group input,
        .comment-field-group textarea {
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            padding: 0.85rem 1rem;
            background: var(--white);
            border: 1px solid var(--sand);
            border-radius: 8px;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .comment-field-group input:focus,
        .comment-field-group textarea:focus {
            outline: none;
            border-color: var(--olive);
            box-shadow: 0 0 0 3px rgba(107, 112, 64, 0.15);
        }

        /* Sisi Kanan */
        .comments-right {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .comments-list-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 400;
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--sand-light);
        }

        .comment-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Desain Item Komentar */
        .comment-card-item {
            background: var(--white);
            border: 1px solid var(--sand-light);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            gap: 1.2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s ease;
        }

        .comment-card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(107, 112, 64, 0.06);
        }

        .comment-user-avatar {
            width: 46px;
            height: 46px;
            background: var(--olive-pale);
            color: var(--text-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .comment-user-name {
            font-weight: 500;
            color: var(--text-dark);
            font-size: 1.05rem;
            margin: 0;
        }

        .comment-user-status {
            display: block;
            font-size: 0.75rem;
            color: var(--olive);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.2rem;
        }

        .comment-timestamp {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .comment-text-content {
            color: var(--text-mid);
            font-size: 0.95rem;
            line-height: 1.7;
            margin: 0;
        }

        /* Responsif untuk Tablet & Handphone */
        @media (max-width: 860px) {
            .comments-grid {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            .comments-container {
                padding-top: 1.5rem;
            }
            .back-nav {
                margin-bottom: 2rem;
            }
        }
    </style>
</head>

    <!-- Konten Utama -->
    <main class="comments-container">
        
        <!-- Tombol Kembali -->
        <div class="back-nav">
            <a href="index.html" class="btn-outline">← Kembali ke Portfolio</a>
        </div>

        <div class="comments-grid">
            
            <!-- SISI KIRI: Teks Perkenalan & Form -->
            <div class="comments-left">
                <!-- Teks Hero -->
                <div>
                    <p class="section-eyebrow">Mari Berkomentar</p>
                    <h2 class="section-title">Berikan<br>Komentar <em>Anda</em></h2>
                    <div class="divider" style="margin-bottom: 0; width: 40px;"></div>
                </div>

                <!-- Form Komentar -->
                <div class="comment-form-card">
                    <form id="mainCommentForm">
                        <div class="comment-field-group">
                            <label for="inputName">Nama</label>
                            <input type="text" id="inputName" required placeholder="Masukkan nama Anda">
                        </div>
                        <div class="comment-field-group">
                            <label for="inputStatus">Status (Opsional)</label>
                            <input type="text" id="inputStatus" placeholder="Contoh: Teman Kuliah, HRD">
                        </div>
                        <div class="comment-field-group">
                            <label for="inputText">Pesan</label>
                            <textarea id="inputText" rows="4" required placeholder="Tuliskan pesan atau kesan Anda..."></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem; border-radius: 8px;">
                            <span>Kirim Pesan</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- SISI KANAN: Daftar Komentar -->
            <div class="comments-right">
                <h3 class="comments-list-title">Daftar Komentar</h3>
                
                <div class="comment-wrapper" id="commentWrapper">
                    <p style="text-align: center; color: var(--text-light); font-style: italic; padding: 2rem 0;">Memuat komentar...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Integrasi Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCECzgxZGw8fU5HBPE5EOsTtnGA6HsT8I",
            authDomain: "web-komen-tiara.firebaseapp.com",
            projectId: "web-komen-tiara",
            storageBucket: "web-komen-tiara.firebasestorage.app",
            messagingSenderId: "1008475645047",
            appId: "1:1008475645047:web:6e0761a5aaf965862bd272",
            measurementId: "G-9MLF950VYM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fungsi Submit Komentar
        document.getElementById('mainCommentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('span');
            btn.disabled = true;
            btnText.innerText = "Mengirim...";
            
            try {
                await addDoc(collection(db, "comments"), {
                    name: document.getElementById('inputName').value,
                    status: document.getElementById('inputStatus').value,
                    message: document.getElementById('inputText').value,
                    timestamp: serverTimestamp()
                });
                document.getElementById('mainCommentForm').reset();
            } catch (err) {
                alert("Gagal mengirim komentar: " + err.message);
            } finally {
                btn.disabled = false;
                btnText.innerText = "Kirim Pesan";
            }
        });

        // Menampilkan Komentar secara Real-time
        const q = query(collection(db, "comments"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const wrapper = document.getElementById('commentWrapper');
            wrapper.innerHTML = ''; 
            
            if (snapshot.empty) {
                wrapper.innerHTML = '<p style="text-align:center; color: var(--text-light); font-style: italic; padding: 2rem 0;">Belum ada komentar. Jadilah yang pertama!</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const initial = data.name ? data.name.charAt(0).toUpperCase() : '?';
                
                let timeString = '';
                if(data.timestamp) {
                    const date = data.timestamp.toDate();
                    timeString = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                }

                const div = document.createElement('div');
                div.className = 'comment-card-item';
                div.innerHTML = `
                    <div class="comment-user-avatar">${initial}</div>
                    <div class="comment-body" style="flex: 1;">
                        <div class="comment-meta">
                            <div>
                                <h4 class="comment-user-name">${data.name}</h4>
                                ${data.status ? `<span class="comment-user-status">${data.status}</span>` : ''}
                            </div>
                            <span class="comment-timestamp">${timeString}</span>
                        </div>
                        <p class="comment-text-content">${data.message}</p>
                    </div>
                `;
                wrapper.appendChild(div);
            });
        });
    </script>
    
    <!-- Memanggil script utama untuk animasi kursor -->
    <script src="main.js"></script>
