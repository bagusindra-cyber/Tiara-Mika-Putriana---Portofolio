<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komentar — Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body style="background: var(--cream); color: var(--text-dark); min-height: 100vh;">

    <header style="padding: 2rem var(--px); border-bottom: 1px solid var(--sand-light);">
        <a href="index.html" class="btn-outline">← Kembali ke Portfolio</a>
    </header>

    <main style="padding: 2rem var(--px); max-width: 900px; margin: 0 auto;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Kolom Komentar</h1>

        <div class="comments-page-container" style="display: grid; gap: 2rem;">
            <div class="comment-form-card" style="background: var(--white); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--sand-light);">
                <form id="mainCommentForm">
                    <div class="comment-field-group"><label>Nama</label><input type="text" id="inputName" required></div>
                    <div class="comment-field-group"><label>Status (Opsional)</label><input type="text" id="inputStatus"></div>
                    <div class="comment-field-group"><label>Pesan</label><textarea id="inputText" rows="4" required></textarea></div>
                    <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%;">Kirim Pesan</button>
                </form>
            </div>

            <div class="comment-display-card">
                <div class="comment-wrapper" id="commentWrapper">
                    <p style="text-align: center;">Memuat komentar...</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCECzgxZGw8fU5HBPE5EOsTtnGA6HsT8I",
            authDomain: "web-komen-tiara.firebaseapp.com",
            projectId: "web-komen-tiara",
            storageBucket: "web-komen-tiara.firebasestorage.app",
            messagingSenderId: "1008475645047",
            appId: "1:1008475645047:web:b5d6499bd99f4ccd2bd272",
            measurementId: "G-J3KGB1MYJ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Submit Logic
        document.getElementById('mainCommentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Mengirim...";
            
            try {
                await addDoc(collection(db, "comments"), {
                    name: document.getElementById('inputName').value,
                    status: document.getElementById('inputStatus').value,
                    message: document.getElementById('inputText').value,
                    timestamp: serverTimestamp()
                });
                document.getElementById('mainCommentForm').reset();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim Pesan";
            }
        });

        // Real-time Listener
        const q = query(collection(db, "comments"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const wrapper = document.getElementById('commentWrapper');
            wrapper.innerHTML = ''; 
            
            if (snapshot.empty) {
                wrapper.innerHTML = '<p style="text-align:center;">Belum ada komentar.</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const div = document.createElement('div');
                div.className = 'comment-card-item';
                div.innerHTML = `
                    <div class="comment-body" style="padding: 1rem; border: 1px solid #eee; margin-bottom: 1rem; border-radius: 8px;">
                        <h4 style="margin:0;">${data.name}</h4>
                        <small style="color:gray;">${data.status || ''}</small>
                        <p style="margin: 0.5rem 0;">${data.message}</p>
                        <button onclick="window.del('${docSnap.id}')" style="cursor:pointer; color:red; border:none; background:none; font-size: 0.8rem;">Hapus</button>
                    </div>
                `;
                wrapper.appendChild(div);
            });
        });

        window.del = async (id) => {
            if(confirm("Yakin hapus?")) await deleteDoc(doc(db, "comments", id));
        };
    </script>
</body>
</html>
