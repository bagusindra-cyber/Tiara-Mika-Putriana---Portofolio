<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komentar — Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--cream); color: var(--text-dark); min-height: 100vh;">

    <header style="padding: var(--space-md) var(--px); background: var(--white); border-bottom: 1px solid var(--sand-light);">
        <div style="max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="btn-outline">← Kembali</a>
        </div>
    </header>

    <main style="padding: var(--space-lg) var(--px); max-width: 1100px; margin: 0 auto;">
        <div class="comments-page-container">
            <div class="comment-form-card">
                <h3 class="comment-block-title">Tulis Komentar</h3>
                <form id="mainCommentForm">
                    <div class="comment-field-group">
                        <label>Nama</label>
                        <input type="text" id="inputName" required>
                    </div>
                    <div class="comment-field-group">
                        <label>Status (Opsional)</label>
                        <input type="text" id="inputStatus">
                    </div>
                    <div class="comment-field-group">
                        <label>Pesan</label>
                        <textarea id="inputText" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Kirim Pesan</button>
                </form>
            </div>

            <div class="comment-display-card">
                <h3 class="comment-block-title">Semua Komentar</h3>
                <div class="comment-wrapper" id="commentWrapper">
                    <p id="loadingText">Menghubungkan ke database...</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCECzgxZGw8fU5HBPE5EOsTtnGA6HsT8I",
            authDomain: "web-komen-tiara.firebaseapp.com",
            projectId: "web-komen-tiara",
            storageBucket: "web-komen-tiara.firebasestorage.app",
            messagingSenderId: "1008475645047",
            appId: "1:1008475645047:web:b5d6499bd99f4ccd2bd272",
            measurementId: "G-J3KGB1MYJ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const commentWrapper = document.getElementById('commentWrapper');

        // FUNGSI KIRIM
        document.getElementById('mainCommentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "comments"), {
                    name: document.getElementById('inputName').value,
                    status: document.getElementById('inputStatus').value,
                    message: document.getElementById('inputText').value,
                    timestamp: serverTimestamp()
                });
                document.getElementById('mainCommentForm').reset();
            } catch (err) {
                alert("Gagal: " + err.message);
            }
        });

        // FUNGSI TAMPIL
        const q = query(collection(db, "comments"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            commentWrapper.innerHTML = '';
            if (snapshot.empty) {
                commentWrapper.innerHTML = '<p>Belum ada komentar.</p>';
                return;
            }
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const div = document.createElement('div');
                div.className = 'comment-card-item';
                div.innerHTML = `
                    <div class="comment-body">
                        <h4>${data.name}</h4>
                        <small>${data.status || ''}</small>
                        <p>${data.message}</p>
                        <button onclick="window.del('${docSnap.id}')">Hapus</button>
                    </div>
                `;
                commentWrapper.appendChild(div);
            });
        });

        window.del = async (id) => {
            await deleteDoc(doc(db, "comments", id));
        };
    </script>
</body>
</html>
